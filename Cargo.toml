[package]
name = "verdant-clock"
version = "0.1.0"
edition = "2021"
description = "A customizable analog desktop clock"

[package.metadata.bundle]
name = "Verdant Clock"
identifier = "com.verdantclock.verdant-clock"
category = "Utility"
short_description = "A customizable analog desktop clock"
long_description = "A desktop analog clock with customizable colors, image backgrounds, opacity controls, and always-on-top mode."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
eframe = { version = "0.31.1", features = ["persistence"] }
image = { version = "0.25.5", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
rfd = "0.15.3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
