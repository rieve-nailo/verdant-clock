name: Package installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: debian
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Debian build dependencies
        if: matrix.platform == 'debian'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxdo-dev \
            pkg-config

      - name: Install cargo-bundle
        if: matrix.platform != 'windows'
        run: cargo install cargo-bundle --version 0.12.0 --locked

      - name: Build Windows application
        if: matrix.platform == 'windows'
        run: cargo build --release

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        run: choco install innosetup --yes --no-progress

      - name: Set Windows installer version
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler installer/windows/verdant-clock.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Debian package
        if: matrix.platform == 'debian'
        run: cargo bundle --release --format deb

      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        run: cargo bundle --release --format dmg

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            windows) test -f dist/Verdant-Clock-Setup.exe ;;
            macos) find target/release/bundle -type f -name '*.dmg' -exec cp {} dist/ \; ;;
            debian) find target/release/bundle -type f -name '*.deb' -exec cp {} dist/ \; ;;
          esac

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: verdant-clock-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
