name: Package installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: debian
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Debian build dependencies
        if: matrix.platform == 'debian'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxdo-dev \
            pkg-config

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked

      - name: Build Debian package
        if: matrix.platform == 'debian'
        run: cargo bundle --release --format deb

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: cargo bundle --release --format msi

      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        run: cargo bundle --release --format dmg

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            windows) find target/release/bundle -type f -name '*.msi' -exec cp {} dist/ \; ;;
            macos) find target/release/bundle -type f -name '*.dmg' -exec cp {} dist/ \; ;;
            debian) find target/release/bundle -type f -name '*.deb' -exec cp {} dist/ \; ;;
          esac

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdant-clock-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
